# Pre-commit hooks for LastMile — secrets-hygiene focused (Tier 1).
#
# One-time setup (per clone):
#   pip install pre-commit
#   pre-commit install
#
# Run against the whole repo on demand:
#   pre-commit run --all-files
#
# These hooks block a commit if a secret, private key, or oversized file
# is about to be committed. See PRODUCTION_READINESS.md (Tier 1).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
        name: Block committed private keys
      - id: check-added-large-files
        name: Block large files (>5 MB)
        args: ["--maxkb=5120"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

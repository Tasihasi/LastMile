name: Secret Scan

# Tier 1 safety: fail the build if a secret is committed to the repo or a PR.
# Mirrors the local gitleaks pre-commit hook so nothing slips past a missing hook.

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan covers every commit

      - name: Install gitleaks
        run: |
          version="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --verbose .

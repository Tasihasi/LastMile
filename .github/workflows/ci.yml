name: CI

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run Django system checks
        run: python manage.py check --fail-level WARNING
        env:
          ORS_API_KEY: test-key

      # Production-settings audit (SECRET_KEY, DEBUG, cookies, HSTS, SSL redirect).
      # Runs with prod-like env (DEBUG=False) so it actually evaluates the
      # deployment config. Non-blocking for now — review the baseline warnings,
      # then drop `continue-on-error` to make it gate merges.
      - name: Production settings audit (check --deploy, non-blocking)
        run: python manage.py check --deploy --fail-level ERROR
        continue-on-error: true
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-deploy-check-placeholder-not-a-real-secret"
          ORS_API_KEY: test-key

      - name: Run migrations
        run: python manage.py migrate
        env:
          ORS_API_KEY: test-key

      - name: Run tests
        run: python manage.py test --verbosity 2
        env:
          ORS_API_KEY: test-key

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: >
      github.event_name == 'pull_request' &&
      (github.base_ref == 'main' || github.base_ref == 'production')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd frontend && npx playwright test
        env:
          E2E_MOCK: "true"
          ORS_API_KEY: "e2e-mock-key"
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Static security scans (no live app needed). All non-blocking for now:
  # review the baseline, then remove `continue-on-error` to make them gate.
  # DAST (ZAP/Wapiti) is intentionally NOT here — it needs real auth first
  # and belongs in a separate scheduled workflow (see PRODUCTION_READINESS.md).
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the full git history, not just the tip.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trivy fs scan covers Python (requirements.txt) + npm (package-lock.json)
      # CVEs and config issues in one pass — replaces separate pip-audit/npm audit.
      # TODO: pin to a release tag once the baseline is reviewed.
      - name: Dependency & config CVE scan (Trivy)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

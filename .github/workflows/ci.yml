name: CI

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Run Django system checks
        run: python manage.py check --fail-level WARNING
        env:
          ORS_API_KEY: test-key

      # Production-settings audit (SECRET_KEY, DEBUG, cookies, HSTS, SSL redirect).
      # Runs with prod-like env (DEBUG=False) so it actually evaluates the
      # deployment config. Non-blocking for now — review the baseline warnings,
      # then drop `continue-on-error` to make it gate merges.
      - name: Production settings audit (check --deploy, non-blocking)
        run: python manage.py check --deploy --fail-level ERROR
        continue-on-error: true
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-deploy-check-placeholder-not-a-real-secret"
          ORS_API_KEY: test-key

      - name: Run migrations
        run: python manage.py migrate
        env:
          ORS_API_KEY: test-key

      - name: Run tests
        run: python manage.py test --verbosity 2
        env:
          ORS_API_KEY: test-key

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: >
      github.event_name == 'pull_request' &&
      (github.base_ref == 'main' || github.base_ref == 'production')

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd frontend && npx playwright test
        env:
          E2E_MOCK: "true"
          ORS_API_KEY: "e2e-mock-key"
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Production-parity smoke test: runs the REAL deploy path (build.sh →
  # collectstatic → gunicorn + WhiteNoise serving the built SPA) which nothing
  # else in CI exercises. E2E uses the Vite dev server + dev Django, so this is
  # the only job that catches build.sh / collectstatic / catch-all-SPA-route /
  # same-origin-/api regressions before they hit Render.
  smoke:
    name: Production Smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DEBUG: "False"
      SECRET_KEY: "ci-smoke-placeholder-not-a-real-secret"
      ORS_API_KEY: "test-key"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run production build (build.sh)
        run: ./build.sh

      - name: Boot gunicorn and smoke-check
        working-directory: backend
        run: |
          gunicorn config.wsgi --bind 127.0.0.1:8000 --daemon --log-file -
          # Wait for the socket to accept connections (max ~15s).
          for i in $(seq 1 15); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          # SPA index served by WhiteNoise + catch-all URL (proves the frontend
          # build is wired into Django, not just built into dist/).
          curl -fsS http://127.0.0.1:8000/ | grep -q "LastMile"
          # API is mounted under gunicorn and auth is wired: unauthenticated
          # /api/auth/me/ must return 401, not 5xx / connection refused.
          code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/auth/me/)
          test "$code" = "401"

  # Static security scans (no live app needed). All non-blocking for now:
  # review the baseline, then remove `continue-on-error` to make them gate.
  # DAST (ZAP/Wapiti) is intentionally NOT here — it needs real auth first
  # and belongs in a separate scheduled workflow (see PRODUCTION_READINESS.md).
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans the full git history, not just the tip.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trivy fs scan covers Python (requirements.txt) + npm (package-lock.json)
      # CVEs and config issues in one pass — replaces separate pip-audit/npm audit.
      # TODO: pin to a release tag once the baseline is reviewed.
      - name: Dependency & config CVE scan (Trivy)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
